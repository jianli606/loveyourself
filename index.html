        key = 'girlfriend'; reason.push('A 项总数 ≥ 22，且维度一、维度二 A 占比超过 60%。');
      }
      if (!key && total.B >= 22 && dims.d5.B >= 6) {
        key = 'coach'; reason.push('B 项总数 ≥ 22，且目标抗性维度 B 占比超过 60%。');
      }
      if (!key && total.C >= 22 && dims.d3.C >= 6) {
        key = 'investor'; reason.push('C 项总数 ≥ 22，且欲望犒赏维度 C 占比超过 60%。');
      }
      if (!key && total.D >= 22 && dims.d1.D >= 6 && dims.d6.D >= 6) {
        key = 'wild'; reason.push('D 项总数 ≥ 22，且维度一、维度六 D 占比超过 60%。');
      }
      if (!key && Math.abs((dims.d1.B + dims.d5.B) - (dims.d1.D + dims.d5.D)) <= 1 && allIn([3,6], ['B','C'])) {
        key = 'doctor'; reason.push('生理与目标抗性维度中 B/D 接近平分，且体力/生病场景优先 B/C，触发老己医生型。');
      }
      if (!key && dims.d6.C >= 7 && total.C === max) {
        key = 'philosopher'; reason.push('独处自省维度 C ≥ 7，且全卷 C 项第一，触发老己哲学家型。');
      }
      if (!key && total.D === max && answers[49] === 'D') {
        key = 'observer'; reason.push('D 项总分第一，且第49题自我对话频率选择 D，触发老己旁观者型。');
      }
      if (!key && answers[46] === 'A' && answers[50] === 'A' && dims.d1.A + dims.d1.B >= 6 && dims.d3.A + dims.d3.B >= 6) {
        key = 'butler'; reason.push('第46、50题均选择 A，且生理/犒赏维度 A/B 高，触发老己仪式感管家型。');
      }
      if (!key && total.A === max && atLeast([17,18,40], 'A', 2)) {
        key = 'keeper'; reason.push('A 项总分第一，且第17、18、40题中至少两题选择 A，触发老己铲屎官型。');
      }
      if (!key && total.B === max && (dims.d5.C >= 3 || answers[41] === 'C')) {
        key = 'admirer'; reason.push('B 项总分第一，但失败应对维度出现较多 C 或第41题选择 C，触发老己仰慕者型。');
      }
      if (!key) {
        key = BASIC_BY_OPTION[top[0]];
        reason.push(`未触发更高优先级特殊阈值，按全卷最高分 ${top.join('/')} 归入基础主体类型。`);
      }
      return { key, total, dims, reason };
    }
    function showResult() {
      const evaluation = evaluateResult();
      const result = quizData.results[evaluation.key];
      $('resultName').textContent = result.name;
      $('resultTrigger').textContent = result.trigger;
      $('detail').textContent = result.detail;
      $('weakness').textContent = result.weakness;
      $('fit').textContent = result.fit;
      show('result');
    }

    $('startBtn').addEventListener('click', startQuiz);
    $('nextBtn').addEventListener('click', nextQuestion);
    $('prevBtn').addEventListener('click', prevQuestion);
    $('restartBtn').addEventListener('click', startQuiz);
    $('backHomeBtn').addEventListener('click', () => show('welcome'));
  </script>
</body>
</html>
